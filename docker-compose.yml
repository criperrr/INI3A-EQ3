# ==============================================================================
# Presco - Docker Compose: Infrastructure Services
# Runs PostgreSQL (with PostGIS) and Redis only.
# Backend and frontend run natively via `turbo run dev`.
#
# Usage:
#   npm run db:up      → start services (detached)
#   npm run db:down    → stop services
#   npm run db:reset   → wipe volumes and restart
#   npm run db:logs    → tail service logs
# ==============================================================================

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: presco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: presco_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d presco_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: presco_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
