name: Nightly Heavy Audit (Mutation & K6 Real Load)

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC diariamente
  workflow_dispatch:

concurrency:
  group: nightly-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  heavy_audit:
    name: Heavy Audit (Mutation, Load & User Journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Subir Infraestrutura de Backend (PostgreSQL + Redis)
        run: |
          docker compose up -d postgres redis
          echo "Aguardando estabilização dos serviços..."
          sleep 4
          timeout 30 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d presco_db; do sleep 1; done'
          timeout 20 bash -c 'until docker compose exec -T redis redis-cli ping; do sleep 1; done'
          echo "✅ Postgres e Redis online e saudáveis!"

      - name: Configurar e Inicializar Backend para Auditoria Noturna
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/presco_db
          REDIS_URL: redis://127.0.0.1:6380
          SERVER_PORT: 3333
          SERVER_HOST: 0.0.0.0
          JWT_SECRET: 3c1985274d967dab44f0da74aaca52036742fd84cdd7c5181c9b819797e8fc3a
          NODE_ENV: test
        run: |
          mkdir -p src/backend
          cat << 'EOF' > src/backend/.env
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/presco_db
          REDIS_URL=redis://127.0.0.1:6380
          SERVER_PORT=3333
          SERVER_HOST=0.0.0.0
          JWT_SECRET=3c1985274d967dab44f0da74aaca52036742fd84cdd7c5181c9b819797e8fc3a
          NODE_ENV=test
          EOF
          cp src/backend/.env .env

          echo "Executando migrações com retry..."
          for i in {1..6}; do
            npm run --prefix src/backend db:migrate && break || (echo "Tentando migração novamente em 2s..." && sleep 2)
          done

          echo "Executando seed com retry..."
          for i in {1..6}; do
            npm run --prefix src/backend db:seed && break || (echo "Tentando seed novamente em 2s..." && sleep 2)
          done

          echo "Iniciando servidor backend em segundo plano..."
          npm run --prefix src/backend start > backend-nightly.log 2>&1 &
          timeout 30 bash -c 'until curl -s http://localhost:3333/health | grep -q "ok"; do sleep 1; done'
          echo "✅ Backend online e respondendo em http://localhost:3333"

      - name: Executar Simulação de Carga e Comportamento Real (Grafana k6)
        env:
          TARGET_ENV: local
          K6_TARGET: local
          BASE_URL: http://localhost:3333
        run: |
          echo "Executando suíte k6 com SLAs rígidos e simulação de jornada..."
          npm run test:k6
          npm run test:k6:journeys || true

      - name: Executar Testes de Concorrência e Mutação
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/presco_db
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: nightly-audit-secret-key-32-chars-long
          NODE_ENV: test
        run: |
          echo "Executando testes de concorrência e resiliência..."
          npm run test:concurrency
          npm test

      - name: Registrar e Acumular Métricas de Desempenho no Histórico
        if: always()
        run: |
          mkdir -p tests/k6/history logs
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%SZ")
          if [ -f tests/k6/summary.json ]; then
            node -e '
              const fs = require("fs");
              try {
                const summary = JSON.parse(fs.readFileSync("tests/k6/summary.json", "utf8"));
                const historyFile = "tests/k6/history/benchmark_history.json";
                const history = fs.existsSync(historyFile) ? JSON.parse(fs.readFileSync(historyFile, "utf8")) : [];
                const entry = {
                  timestamp: process.env.TIMESTAMP || new Date().toISOString(),
                  run_id: process.env.GITHUB_RUN_ID,
                  http_req_duration_p95: summary.metrics?.http_req_duration?.values?.["p(95)"],
                  http_req_duration_avg: summary.metrics?.http_req_duration?.values?.avg,
                  http_req_failed_rate: summary.metrics?.http_req_failed?.values?.rate,
                  total_requests: summary.metrics?.http_reqs?.values?.count,
                  iterations: summary.metrics?.iterations?.values?.count,
                  vus_max: summary.metrics?.vus_max?.values?.value
                };
                history.push(entry);
                fs.writeFileSync(historyFile, JSON.stringify(history, null, 2));
                console.log("✅ Benchmark registrado no histórico:", entry);
              } catch (e) {
                console.warn("Aviso ao processar histórico k6:", e.message);
              }
            '
          fi
          cp backend-nightly.log "logs/backend-nightly-${TIMESTAMP}.log" 2>/dev/null || true

      - name: Publicar e Acumular Relatórios de Performance e Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-nightly-performance-audit-${{ github.run_id }}
          path: |
            tests/k6/report.html
            tests/k6/summary.json
            tests/k6/history/
            backend-nightly.log
            logs/
          if-no-files-found: ignore
          retention-days: 90

      - name: Notificar Falha Noturna Criando Issue no GitHub
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [NIGHTLY AUDIT] Falha detectada na auditoria noturna" \
            --body "A auditoria noturna agendada falhou em um dos steps pesados (Carga k6, Concorrência ou Mutação). Verifique os relatórios acumulados e logs em: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug" || echo "Não foi possível abrir a issue automaticamente."
