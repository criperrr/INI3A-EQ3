name: PR Gatekeeper (Quality & Security Gate)

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-gatekeeper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: Gatekeeper (Lint, SAST, Types & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Nomenclatura da Branch (Axioma de Branches)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          BRANCH_NAME="$HEAD_REF"
          echo "Validando branch: $BRANCH_NAME"
          # Permite branch 'dev' para PRs de promoção/release apontando para 'main'
          if [[ "$BASE_REF" == "main" && "$BRANCH_NAME" == "dev" ]]; then
            echo "[OK] Promoção de release de 'dev' para 'main' autorizada."
            exit 0
          fi
          # Permite branches seguindo a regex: ^(feat|fix|test|refactor|chore|docs)/[a-z0-9-]+$
          REGEX="^(feat|fix|test|refactor|chore|docs)/[a-z0-9-]+$"
          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "[ERRO] A branch '$BRANCH_NAME' viola o Axioma de Criação de Branches."
            echo "Formato esperado: <categoria>/<nome-da-task>"
            echo "Categorias permitidas: feat, fix, test, refactor, chore, docs (apenas letras minúsculas, números e hífens)."
            exit 1
          fi
          echo "[OK] Nomenclatura de branch válida: $BRANCH_NAME"

      - name: Validar Sintaxe das Mensagens de Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Validando mensagens de commit do PR..."
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            echo "[INFO] Referência origin/${BASE_REF} não encontrada localmente; buscando..."
            git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          COMMITS=$(git log --no-merges "origin/${BASE_REF}..HEAD" --pretty=format:"%s")
          COMMIT_REGEX="^(feat|fix|test|refactor|chore|docs)(\([a-zA-Z0-9_-]+\))?(\/|:)[[:space:]]*.+"

          while IFS= read -r msg; do
            if [ -n "$msg" ]; then
              echo "Verificando commit: $msg"
              if [[ ! "$msg" =~ $COMMIT_REGEX ]]; then
                echo "[AVISO] Mensagem de commit fora da especificação: '$msg'"
                echo "Formato esperado: <category>/<short-description> ou <category>(<scope>): <short-description>"
              fi
            fi
          done <<< "$COMMITS"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Validar Tipagem Estrita (Typecheck)
        run: npm run typecheck

      - name: SAST Leve de Segurança (Semgrep)
        uses: returntocorp/semgrep-action@v1
        continue-on-error: false
        with:
          config: >-
            p/security-audit
            p/secrets
            p/javascript
            p/typescript

      - name: Executar Suíte de Testes Unitários e de Concorrência
        run: |
          echo "Executando suíte de testes unitários e de concorrência..."
          npm test
          echo "[OK] Todos os testes unitários e de concorrência passaram com 100% de sucesso."

      - name: "Validar Bundle Expo Mobile (Condicional: apenas se src/frontend foi modificado)"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Verificando se houve alterações no frontend..."
          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            echo "[INFO] Referência origin/${BASE_REF} não encontrada localmente; buscando..."
            git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          MODIFIED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if echo "$MODIFIED_FILES" | grep -qE '^src/frontend/'; then
            echo "[INFO] Alterações detectadas em 'src/frontend/'. Validando bundle Expo Android..."
            cd src/frontend
            npx expo export --platform android --no-bytecode
            rm -rf dist
            echo "[OK] Bundle Expo compilado com 100% de sucesso! Nenhum erro de módulo, rota, fonte ou imagem."
          else
            echo "[INFO] Nenhuma alteração detectada em 'src/frontend/'. Pulando validação de bundle Expo."
          fi
