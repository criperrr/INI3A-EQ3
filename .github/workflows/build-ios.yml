name: Build iOS IPA (Sideloadly)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para compilar (ex: tests ou main)"
        required: false
        default: "tests"
  push:
    tags:
      - "ios-v*"

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Selecionar Versão Compatível do Xcode (React Native 0.86 exige >= 16.1)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || true
          xcodebuild -version

      - name: Baixar Plataforma iOS para Xcode 16.2
        run: |
          xcrun simctl list > /dev/null || true
          sudo xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS -buildVersion 18.2 || true

      - name: Instalar Dependências Raiz
        run: npm install --prefer-offline --no-audit

      - name: Instalar Dependências do Frontend
        working-directory: src/frontend
        run: npm install --prefer-offline --no-audit

      - name: Configurar Variáveis de Ambiente do Frontend
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p src/frontend
          cat << EOF > src/frontend/.env
          EXPO_PUBLIC_API_URL=${PUBLIC_URL:-https://eq.projetoscti.com.br/26-presco}
          EXPO_PUBLIC_HERE_API_KEY=${HERE_API_KEY}
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          EOF

      - name: Preparar Frontend para Release (Remover expo-dev-client)
        working-directory: src/frontend
        run: |
          # expo-dev-client e expo-dev-menu contêm assets de simulador incompatíveis com o actool do Xcode 16.2 em builds Release
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            appJson.expo.plugins = (appJson.expo.plugins || []).filter(p => p !== "expo-dev-client");
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2));

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.dependencies["expo-dev-client"];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --prefer-offline --no-audit

      - name: Gerar Projeto Nativo iOS (Expo Prebuild)
        working-directory: src/frontend
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Limpar Cache do CocoaPods e DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/CocoaPods
          pod repo update

      - name: Corrigir Compatibilidade de Swift Package Manager e ExpoModulesJSI
        run: |
          # Patch de compatibilidade com Swift 6.0 (Xcode 16.2):
          # 1. Downgrade de swift-tools-version de 6.2 para 6.0
          # 2. Remoção de vírgulas trailing antes de parênteses de fechamento (sintaxe do Swift 6.2 inválida no Swift 6.0)
          # 3. Remoção de features experimentais do Swift 6.2 (NonisolatedNonsendingByDefault, InferIsolatedConformances)
          # 4. Remoção de SWIFT_RETURNS_RETAINED em construtores C++ (inválido e rejeitado pelo Clang/Swift 6.0)
          node -e '
            const fs = require("fs");
            const path = require("path");

            function patchDirectory(dir) {
              if (!fs.existsSync(dir)) return;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== ".git" && entry.name !== ".build" && entry.name !== "build") {
                    patchDirectory(full);
                  }
                } else if (entry.name === "Package.swift" || entry.name.endsWith(".swift")) {
                  try {
                    let content = fs.readFileSync(full, "utf8");
                    let modified = false;

                    if (entry.name === "Package.swift" && /swift-tools-version:\s*6\.[1-9]/.test(content)) {
                      content = content.replace(/swift-tools-version:\s*6\.[1-9]/g, "swift-tools-version: 6.0");
                      modified = true;
                    }

                    if (/,(\s*\))/.test(content)) {
                      content = content.replace(/,(\s*\))/g, "$1");
                      modified = true;
                    }

                    if (entry.name === "Package.swift" && /enableUpcomingFeature/.test(content)) {
                      content = content.replace(/\.enableUpcomingFeature\("NonisolatedNonsendingByDefault"\),?/g, "");
                      content = content.replace(/\.enableUpcomingFeature\("InferIsolatedConformances"\),?/g, "");
                      modified = true;
                    }

                    if (modified) {
                      fs.writeFileSync(full, content, "utf8");
                      console.log("Patched Swift syntax in:", full);
                    }
                  } catch (err) {}
                } else if (entry.name.endsWith(".h") || entry.name.endsWith(".hpp")) {
                  try {
                    let content = fs.readFileSync(full, "utf8");
                    if (content.includes("SWIFT_RETURNS_RETAINED")) {
                      content = content.replace(/SWIFT_RETURNS_RETAINED\s+/g, "");
                      fs.writeFileSync(full, content, "utf8");
                      console.log("Patched SWIFT_RETURNS_RETAINED in:", full);
                    }
                  } catch (err) {}
                }
              }
            }

            ["node_modules", "src/frontend"].forEach(d => patchDirectory(d));
          '

      - name: Instalar Pods iOS
        working-directory: src/frontend/ios
        run: |
          pod install

      - name: Corrigir Build Scripts e Toolchain nos Pods
        run: |
          # 1. Re-executa o patch de sintaxe Swift e C++ caso o pod install tenha descompactado/gerado arquivos
          node -e '
            const fs = require("fs");
            const path = require("path");

            function patchDirectory(dir) {
              if (!fs.existsSync(dir)) return;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== ".git" && entry.name !== ".build" && entry.name !== "build") {
                    patchDirectory(full);
                  }
                } else if (entry.name === "Package.swift" || entry.name.endsWith(".swift")) {
                  try {
                    let content = fs.readFileSync(full, "utf8");
                    let modified = false;

                    if (entry.name === "Package.swift" && /swift-tools-version:\s*6\.[1-9]/.test(content)) {
                      content = content.replace(/swift-tools-version:\s*6\.[1-9]/g, "swift-tools-version: 6.0");
                      modified = true;
                    }

                    if (/,(\s*\))/.test(content)) {
                      content = content.replace(/,(\s*\))/g, "$1");
                      modified = true;
                    }

                    if (entry.name === "Package.swift" && /enableUpcomingFeature/.test(content)) {
                      content = content.replace(/\.enableUpcomingFeature\("NonisolatedNonsendingByDefault"\),?/g, "");
                      content = content.replace(/\.enableUpcomingFeature\("InferIsolatedConformances"\),?/g, "");
                      modified = true;
                    }

                    if (modified) {
                      fs.writeFileSync(full, content, "utf8");
                      console.log("Patched Swift syntax in:", full);
                    }
                  } catch (err) {}
                } else if (entry.name.endsWith(".h") || entry.name.endsWith(".hpp")) {
                  try {
                    let content = fs.readFileSync(full, "utf8");
                    if (content.includes("SWIFT_RETURNS_RETAINED")) {
                      content = content.replace(/SWIFT_RETURNS_RETAINED\s+/g, "");
                      fs.writeFileSync(full, content, "utf8");
                      console.log("Patched SWIFT_RETURNS_RETAINED in:", full);
                    }
                  } catch (err) {}
                }
              }
            }

            ["node_modules", "src/frontend"].forEach(d => patchDirectory(d));
          '

          # 2. Patch em referências de versão nos scripts shell do CocoaPods
          find src/frontend/ios/Pods -name "*.sh" -exec sed -i '' -e 's/6.2.0/6.0.0/g' {} + 2>/dev/null || true
          find src/frontend/ios/Pods -name "*.sh" -exec sed -i '' -e 's/6.2/6.0/g' {} + 2>/dev/null || true
          find src/frontend/ios/Pods/Target\ Support\ Files -type f -exec sed -i '' -e 's/6.2/6.0/g' {} + 2>/dev/null || true

      - name: Compilar App iOS com Xcodebuild (Sem assinatura para Sideloadly)
        working-directory: src/frontend/ios
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Presco.xcworkspace \
            -scheme Presco \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=YES \
            EXCLUDED_ARCHS="arm64e" \
            SWIFT_VERSION=5.0 \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee xcodebuild.log | grep -E "(error:|fatal error:|BUILD FAILED|\*\* BUILD FAILED \*\*|The following build commands failed:)" -B 2 -A 5 || true

          if grep -q "\*\* BUILD FAILED \*\*" xcodebuild.log; then
            echo "::error::Xcodebuild falhou! Trecho com os erros:"
            grep -E "(error:|fatal error:)" xcodebuild.log -A 4 -B 2 | head -n 40
            exit 1
          fi

      - name: Empacotar Payload e Gerar .ipa
        working-directory: src/frontend/ios
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erro: Arquivo .app não encontrado!"
            exit 1
          fi
          echo "Copiando $APP_PATH para Payload..."
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Presco.ipa Payload
          echo "IPA gerado com sucesso em src/frontend/ios/build/Presco.ipa"

      - name: Publicar IPA como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: Presco-iOS-IPA
          path: src/frontend/ios/build/Presco.ipa
          retention-days: 7
