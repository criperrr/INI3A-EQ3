appId: com.presco.app
---
# Subflow: Dismiss Onboarding Tutorial & Dev Menu if Visible
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible:
        id: "dismiss-tutorial-button"
    commands:
      - tapOn:
          id: "dismiss-tutorial-button"

- runFlow:
    when:
      visible: "Pular tutorial"
    commands:
      - tapOn: "Pular tutorial"

- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Pular"
    commands:
      - tapOn: "Pular"

- runFlow:
    when:
      visible: "Entendi"
    commands:
      - tapOn: "Entendi"

- runFlow:
    when:
      visible: "(?i).*Runtime version.*|.*Toggle performance monitor.*"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 500

- runFlow:
    when:
      visible: "Fetch development servers"
    commands:
      - tapOn: "Fetch development servers"
      - waitForAnimationToEnd:
          timeout: 2000

- runFlow:
    when:
      visible: "Connect"
    commands:
      - tapOn: "Connect"
      - waitForAnimationToEnd:
          timeout: 3000
