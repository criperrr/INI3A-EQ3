/var/www/equipes/26-presco/shared/logs/*.log
/var/www/equipes/26-presco/staging/shared/logs/*.log
/var/www/equipes/26-presco/logs/*.log
/var/www/equipes/26-presco/staging/logs/*.log
/home/ra2457039/.pm2/pm2.log {
    daily
    maxsize 10M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0660
    sharedscripts
    postrotate
        PM2_DIR="${PM2_HOME:-$HOME/.pm2}"
        PM2_SOCK="$PM2_DIR/rpc.sock"
        if [ -S "$PM2_SOCK" ] && [ -w "$PM2_SOCK" ]; then
            if ! command -v pm2 >/dev/null 2>&1; then
                if [ -d "$HOME/.nvm/versions/node" ]; then
                    NVM_BIN="$(ls -1d "$HOME/.nvm/versions/node/"*/bin 2>/dev/null | tail -n 1 || true)"
                    [ -n "$NVM_BIN" ] && PATH="$NVM_BIN:$PATH"
                fi
                PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
                export PATH
            fi
            if command -v pm2 >/dev/null 2>&1; then
                pm2 reloadLogs >/dev/null 2>&1 || true
            fi
        fi
    endscript
}
